<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000813"><title>ENDRAX AI</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000813;color:#e9faff;font-family:system-ui,sans-serif}button,input{font:inherit}.stage{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#000813}.face{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;animation:breathe 7s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.01)}}.mouth{position:absolute;top:67%;left:40%;width:20%;height:.6%;border:1px solid #35daff;border-radius:50%;background:#001321;box-shadow:0 0 8px #05bfff;pointer-events:none;opacity:.8}.talk .mouth{animation:talk .22s infinite alternate}@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(4.8)}}.hit{position:absolute;border:0;background:transparent;z-index:3;cursor:pointer}.menu{top:0;left:1%;width:17%;height:9%}.mic{bottom:1.5%;left:40%;width:20%;height:12%}.panel,.results{position:absolute;z-index:5;top:12%;left:4%;right:4%;padding:15px;border:1px solid #10baff;background:#00111bf2;border-radius:16px;max-height:70%;overflow:auto}.results{left:25%;top:27%}.panel[hidden],.results[hidden],.status[hidden]{display:none}.panel button,.results button,.panel a{border:1px solid #0aa7ea;background:#052235;color:white;border-radius:9px;padding:10px;margin:4px}.field{width:100%;padding:10px;background:#00101d;border:1px solid #0aa7ea;color:white;border-radius:9px}.status{position:absolute;z-index:6;bottom:13%;left:15%;right:15%;padding:10px;text-align:center;background:#001928;border:1px solid cyan;border-radius:15px}.close{float:right}.preview img,.preview video{max-width:100%;max-height:200px}.results a{color:#5bdcff;overflow-wrap:anywhere}
</style></head><body><main id="stage" class="stage"><img class="face" src="face.png" alt="ENDRAX AI"><div class="mouth"></div><button class="hit menu" id="menuBtn" aria-label="Menu"></button><button class="hit mic" id="micBtn" aria-label="Microphone"></button><div id="status" class="status" hidden></div><section id="panel" class="panel" hidden><button class="close" id="closeMenu">✕</button><h2>ENDRAX AI Menu</h2><button id="talk">Talking demo</button><button id="stopTalk">Stop</button><button id="youtube">YouTube</button><button id="weather">Weather</button><button id="news">News</button><button id="image">Image design</button><p>Message / Link</p><input class="field" id="message" placeholder="Message or link"><button id="send">Show card</button><p>Photo / Video / PDF</p><input class="field" id="file" type="file" accept="image/*,video/*,.pdf,application/pdf"><div class="preview" id="filePreview"></div></section><section id="results" class="results" hidden><button class="close" id="closeResults">✕</button><h3 id="resultTitle"></h3><div id="resultBody"></div></section></main><script>
'use strict';const el=id=>document.getElementById(id),stage=el('stage'),panel=el('panel'),results=el('results');let stream=null,ctx=null,analyser=null,raf=0,voiceActive=false,previewURL=null;
function showStatus(s){el('status').textContent=s;el('status').hidden=false;setTimeout(()=>el('status').hidden=true,3000)}
function card(title,content){el('resultTitle').textContent=title;el('resultBody').replaceChildren();if(typeof content==='string'){el('resultBody').textContent=content}else{el('resultBody').append(content)}results.hidden=false;panel.hidden=true}
function external(url,label){const a=document.createElement('a');a.href=url;a.textContent=label;a.target='_blank';a.rel='noopener noreferrer';return a}
function endTalk(){voiceActive=false;if('speechSynthesis' in window)speechSynthesis.cancel();if(!stream)stage.classList.remove('talk')}
el('menuBtn').onclick=()=>panel.hidden=!panel.hidden;
el('closeMenu').onclick=()=>panel.hidden=true;
el('closeResults').onclick=()=>results.hidden=true;
el('youtube').onclick=()=>card('YouTube Results',external('https://www.youtube.com/results?search_query=AI+technology','Open YouTube Search'));
el('weather').onclick=()=>card('Weather',external('https://www.google.com/search?q=weather','Weather Search'));
el('news').onclick=()=>card('News',external('https://news.google.com/','Google News'));
el('image').onclick=()=>card('Image Design','AI image generation තවම සම්බන්ධ නැහැ.');
el('send').onclick=()=>{const s=el('message').value.trim();if(!s)return;if(/^https?:\/\//i.test(s)){try{const u=new URL(s);card('Your Link',external(u.href,u.href))}catch{card('Error','Invalid URL')}}else card('Message',s+' — AI Brain තවම සම්බන්ධ නැහැ.')};
el('file').onchange=()=>{const p=el('filePreview');p.replaceChildren();if(previewURL)URL.revokeObjectURL(previewURL);const f=el('file').files[0];if(!f)return;const label=document.createElement('p');label.textContent=f.name+' (Local preview only)';p.append(label);if(f.type.startsWith('image/')||f.type.startsWith('video/')){previewURL=URL.createObjectURL(f);const media=document.createElement(f.type.startsWith('image/')?'img':'video');media.src=previewURL;if(media.tagName==='VIDEO')media.controls=true;p.append(media)}};
el('talk').onclick=()=>{endTalk();panel.hidden=true;voiceActive=true;stage.classList.add('talk');showStatus('Talking demo');if('speechSynthesis' in window){const msg=new SpeechSynthesisUtterance('ආයුබෝවන්. මම එන්ඩ්‍රැක්ස් ඒ අයි.');msg.lang='si-LK';msg.onend=()=>{voiceActive=false;if(!stream)stage.classList.remove('talk')};msg.onerror=msg.onend;speechSynthesis.speak(msg)}else setTimeout(endTalk,2500)};
el('stopTalk').onclick=endTalk;
async function stopMic(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx){await ctx.close().catch(()=>{});ctx=null}if(!voiceActive)stage.classList.remove('talk');showStatus('Mic OFF')}
el('micBtn').onclick=async()=>{if(stream){await stopMic();return}if(!navigator.mediaDevices?.getUserMedia){showStatus('Microphone unavailable');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new (window.AudioContext||window.webkitAudioContext)();const source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=256;source.connect(analyser);const data=new Uint8Array(analyser.frequencyBinCount);function tick(){if(!stream)return;analyser.getByteFrequencyData(data);const avg=data.reduce((a,b)=>a+b,0)/data.length;stage.classList.toggle('talk',avg>15||voiceActive);raf=requestAnimationFrame(tick)}tick();showStatus('Mic ON')}catch(e){showStatus('Mic permission unavailable')}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(stream)stopMic();endTalk()}});
</script></body></html>

<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000817"><title>ENDRAX AI</title><style>
*{box-sizing:border-box}html,body{padding:0;margin:0;width:100%;height:100%;background:#000813;color:#e9faff;font-family:system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}.screen{position:relative;width:100%;height:100dvh;min-height:490px;overflow:hidden;background:#000813}.art{position:absolute;width:100%;height:100%;object-fit:fill;inset:0;pointer-events:none}.hit{position:absolute;border:0;background:transparent;cursor:pointer;z-index:2;touch-action:manipulation}.menu-hit{left:0;top:0;width:18%;height:10%}.mic-hit{width:24%;height:11%;left:38%;bottom:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.panel{position:absolute;z-index:4;left:4%;right:4%;top:7%;max-height:70%;overflow:auto;border:1px solid #07bdf5;border-radius:18px;background:rgba(0,12,27,.97);box-shadow:0 0 32px #0077bd55;padding:16px}.panel[hidden],.status[hidden]{display:none}.panel h2{font-size:18px;margin:0 0 12px;color:#46dfff}.menu-items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.menu-items button,.action,.close{color:white;background:#08243b;border:1px solid #178fc3;border-radius:12px;min-height:46px;padding:10px;cursor:pointer}.close{float:right;min-height:32px;padding:4px 10px}.field{width:100%;min-height:44px;margin-top:10px;color:white;background:#031322;border:1px solid #1687bc;border-radius:10px;padding:10px}.action{margin-top:10px;background:#00659a}.preview{margin-top:12px;overflow-wrap:anywhere;max-height:25vh;overflow:auto;font-size:14px}.preview img,.preview video{max-width:100%;max-height:24vh;border-radius:9px}.status{position:absolute;z-index:3;bottom:12%;left:14%;right:14%;padding:9px 12px;text-align:center;color:white;background:#240616ee;border:1px solid #ff355c;border-radius:20px;font-size:13px}.file-picker{display:none}.panel-title{margin-top:12px;font-size:13px;color:#badcea}.preview a{color:#70dfff} @media(min-aspect-ratio:3/4){.screen{max-width:470px;margin:auto}.art{object-fit:fill}}
</style></head><body><main class="screen"><img class="art" src="face.png" alt="ENDRAX AI neon blue wireframe face with menu and microphone"><button class="hit menu-hit" id="menuButton" aria-label="Open attachments and message menu"><span class="sr-only">Menu</span></button><button class="hit mic-hit" id="micButton" aria-label="Turn microphone on or off"><span class="sr-only">Microphone</span></button><div class="status" id="status" hidden role="status"></div><section class="panel" id="panel" hidden aria-label="Add to ENDRAX AI"><button class="close" id="close" aria-label="Close menu">✕</button><h2>ENDRAX AI · Add</h2><div class="menu-items"><button data-type="photo">🖼 Photo</button><button data-type="video">🎬 Video</button><button data-type="pdf">📄 PDF</button><button data-type="link">🔗 Link</button><button data-type="message">✉ Message</button></div><div class="panel-title" id="formTitle"></div><div id="form"></div><div id="preview" class="preview" aria-live="polite"></div></section></main><script>
const $=id=>document.getElementById(id), panel=$('panel'),form=$('form'),preview=$('preview'),status=$('status');let stream=null,localUrl=null;
function show(s){status.textContent=s;status.hidden=false}function clearPreview(){preview.textContent='';if(localUrl){URL.revokeObjectURL(localUrl);localUrl=null}}
$('menuButton').onclick=()=>{panel.hidden=!panel.hidden};$('close').onclick=()=>panel.hidden=true;
for(const b of document.querySelectorAll('[data-type]'))b.onclick=()=>{const type=b.dataset.type;clearPreview();form.replaceChildren();$('formTitle').textContent=type.toUpperCase();if(['photo','video','pdf'].includes(type)){const input=document.createElement('input');input.type='file';input.className='field';input.accept=type==='photo'?'image/*':type==='video'?'video/*':'.pdf,application/pdf';form.append(input);input.onchange=()=>{clearPreview();const f=input.files?.[0];if(!f)return;const p=document.createElement('p');p.textContent='Selected: '+f.name;preview.append(p);if(type!=='pdf'){localUrl=URL.createObjectURL(f);const media=document.createElement(type==='photo'?'img':'video');media.src=localUrl;if(type==='video')media.controls=true;preview.append(media)}const note=document.createElement('p');note.textContent='මෙය මේ දුරකථනයේ Preview එකක් පමණයි. AI වෙත Upload නොවේ.';preview.append(note)}}else{const input=document.createElement(type==='message'?'textarea':'input');input.className='field';input.placeholder=type==='link'?'Paste URL here':'Type a message';if(type==='link'){input.type='url';input.inputMode='url'}else input.rows=3;form.append(input);const send=document.createElement('button');send.className='action';send.textContent='Preview';send.onclick=()=>{clearPreview();const val=input.value.trim();if(!val)return; if(type==='link'){try{const u=new URL(val);if(!['https:','http:'].includes(u.protocol))throw Error();const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=u.href;preview.append(a)}catch{preview.textContent='Valid https:// link එකක් Paste කරන්න'}}else{preview.textContent='Message: '+val+'\n(Preview only — AI brain තවම සම්බන්ධ නැහැ)'}};form.append(send)}};
$('micButton').onclick=async()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;show('Microphone OFF');return}if(!navigator.mediaDevices?.getUserMedia){show('මෙම Browser එකේ Mic access නොමැත');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});show('Microphone ON · Listening (AI speech recognition නැහැ)')}catch(e){show('Microphone permission අවශ්‍යයි / ලබාදීමට බැරි වුණා')}};
</script></body></html>

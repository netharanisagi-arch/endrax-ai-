<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000813"><title>ENDRAX AI V6</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000813;color:#e9faff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}button,input,textarea{font:inherit}.stage{position:relative;width:100%;height:100svh;min-height:0;max-width:none;margin:0;overflow:hidden;background:#000813}.face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;pointer-events:none;transform-origin:50% 46%;animation:breathe 7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015) translateY(-.2%)}}.glow{position:absolute;left:18%;right:18%;top:27%;height:43%;border-radius:50%;box-shadow:0 0 65px #0af2ff22;pointer-events:none;animation:glow 3s ease-in-out infinite alternate}@keyframes glow{to{opacity:.35}}.mouth{position:absolute;left:40%;width:20%;top:58.5%;height:.6%;border:1px solid #35daff;border-radius:50%;background:#001321;box-shadow:0 0 8px #05bfff;transform-origin:center center;pointer-events:none;opacity:.8}.talk .mouth{animation:talk .22s ease-in-out infinite alternate}@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(4.8)}}.hit{position:absolute;border:0;background:transparent;cursor:pointer;z-index:3}.menu{left:1%;top:0;width:17%;height:9%}.mic{left:40%;bottom:1.5%;width:20%;height:12%;border-radius:50%}.status{position:absolute;z-index:6;left:18%;right:18%;bottom:12%;background:#041626ee;border:1px solid #25c9ff;border-radius:20px;padding:9px;text-align:center;font-size:13px}.status[hidden],.panel[hidden],.results[hidden]{display:none}.panel,.results{position:absolute;z-index:5;top:10%;left:4%;right:4%;padding:15px;border:1px solid #10baff;background:#00111bf2;border-radius:16px;box-shadow:0 0 30px #008cff55;max-height:72%;overflow:auto}.panel h2,.results h2{font-size:18px;margin:0 0 10px}.panel button,.results button,.card a{border:1px solid #0aa7ea;background:#052235;color:#e9faff;border-radius:10px;padding:9px 11px;min-height:39px;cursor:pointer;text-decoration:none}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.field{background:#00101d;border:1px solid #0aa7ea;border-radius:9px;color:white;padding:10px;width:100%;min-height:43px}.close{float:right}.card{background:#001d2be6;border:1px solid #168ad0;border-radius:12px;padding:13px;margin:9px 0}.card img,.card video{display:block;max-width:100%;max-height:220px;border-radius:9px;margin-top:8px}.muted{font-size:12px;color:#b4d5e6}.results{right:3%;left:30%;top:24%;font-size:14px}.results h2{font-size:16px}.results a{overflow-wrap:anywhere;display:inline-block;margin:6px 0}.results .close{min-height:30px}.preview{max-height:190px;overflow:auto;overflow-wrap:anywhere}@media(max-width:420px){.results{left:22%;right:3%;top:27%;font-size:12px}.results h2{font-size:14px}}@media(prefers-reduced-motion:reduce){.face,.glow,.talk .mouth{animation:none}}
@supports(height:100dvh){.stage{height:100dvh}}@media(max-height:650px){.results,.panel{top:6%;max-height:75%}}


/* ENDRAX V6 iPhone edge-to-edge override */
html,body{width:100%!important;max-width:none!important;margin:0!important;padding:0!important;overflow:hidden!important}
body{position:fixed!important;inset:0!important}
.stage{position:fixed!important;inset:0!important;width:100vw!important;max-width:none!important;height:100vh!important;height:100dvh!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important}
.face{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-width:none!important;object-fit:cover!important;object-position:50% 50%!important}
.menu{top:max(0px,env(safe-area-inset-top))!important}
.mic{bottom:max(0px,env(safe-area-inset-bottom))!important}
@media(display-mode:standalone){.stage{height:100dvh!important}}
</style></head><body><main class="stage" id="stage"><img class="face" src="face.png" alt="ENDRAX AI neon wireframe face"><div class="glow"></div><div class="mouth"></div><button class="hit menu" id="menuButton" aria-label="Open ENDRAX menu"></button><button class="hit mic" id="micButton" aria-label="Microphone on or off"></button><div class="status" id="status" hidden aria-live="polite"></div><section class="panel" id="panel" hidden><button class="close" id="closeMenu">✕</button><h2>ENDRAX AI · Menu</h2><p class="muted">Demo controls · Live AI තවම නැහැ</p><div class="row"><button id="talk">▶ Talking demo</button><button id="stopTalk">◼ Stop</button><button id="weather">Weather</button><button id="news">News</button><button id="youtube">YouTube</button><button id="image">Image design</button></div><input class="field" id="message" placeholder="Message or link paste කරන්න"><div class="row"><button id="send">Show card</button></div><input class="field" id="file" type="file" accept="image/*,video/*,.pdf,application/pdf"><p class="muted">Photo / Video / PDF දුරකථනයේ Preview විතරයි. AI වෙත යවන්නේ නැහැ.</p><div class="preview" id="filePreview"></div></section><section class="results" id="results" hidden><button class="close" id="closeResults">✕</button><h2 id="resultTitle">Results</h2><div id="resultBody"></div></section></main><script>
'use strict';const el=id=>document.getElementById(id),stage=el('stage'),panel=el('panel'),results=el('results');let stream=null,ctx=null,analyser=null,raf=0,timer=0,voiceActive=false,previewUrl=null;function status(s){el('status').textContent=s;el('status').hidden=false;clearTimeout(timer);timer=setTimeout(()=>el('status').hidden=true,3500)}function card(title,nodes){el('resultTitle').textContent=title;el('resultBody').replaceChildren(...nodes);results.hidden=false;panel.hidden=true}function make(tag,txt){const n=document.createElement(tag);n.textContent=txt;return n}function link(url,label){const a=make('a',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}function hideTalk(){voiceActive=false;if(window.speechSynthesis)speechSynthesis.cancel();if(!stream)stage.classList.remove('talk')}el('menuButton').onclick=()=>panel.hidden=!panel.hidden;el('closeMenu').onclick=()=>panel.hidden=true;el('closeResults').onclick=()=>results.hidden=true;
el('youtube').onclick=()=>card('▶ YouTube Results',[make('p','YouTube එකේ සෙවීම සඳහා පහළ link එක ඔබන්න.'),link('https://www.youtube.com/results?search_query=AI+technology','Open YouTube search ↗')]);el('weather').onclick=()=>card('☁ Weather',[make('p','Live weather තවම සම්බන්ධ නැහැ.'),link('https://www.google.com/search?q=weather','Weather search ↗')]);el('news').onclick=()=>card('News',[make('p','Live news තවම සම්බන්ධ නැහැ.'),link('https://news.google.com/','Google News ↗')]);el('image').onclick=()=>card('Image Design',[make('p','මෙය Image Design Card එකේ Demo එකක්. AI image generation තවම සම්බන්ධ නැහැ.')]);el('send').onclick=()=>{const value=el('message').value.trim();if(!value)return;let nodes=[];if(/^https?:\/\//i.test(value)){try{let u=new URL(value);nodes=[make('p','ඔයා ලබාදුන් Link එක:'),link(u.href,u.href)]}catch{nodes=[make('p','වැරදි URL එකක්')]}}else{nodes=[make('p',value),make('p','Demo only · AI response තවම සම්බන්ධ නැහැ')]};card('ENDRAX · Message',nodes)};
el('file').onchange=()=>{const holder=el('filePreview');holder.replaceChildren();if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}const f=el('file').files?.[0];if(!f)return;holder.append(make('p',f.name));if(f.type.startsWith('image/')||f.type.startsWith('video/')){previewUrl=URL.createObjectURL(f);let media=document.createElement(f.type.startsWith('image/')?'img':'video');media.src=previewUrl;if(media.tagName==='VIDEO')media.controls=true;media.style.maxWidth='100%';media.style.maxHeight='170px';holder.append(media)}holder.append(make('p','Local preview only · not uploaded'))};
el('talk').onclick=()=>{hideTalk();panel.hidden=true;voiceActive=true;stage.classList.add('talk');status('Talking demo');if('speechSynthesis' in window){const msg=new SpeechSynthesisUtterance('ආයුබෝවන්. මම එන්ඩ්‍රැක්ස් ඒ අයි.');msg.lang='si-LK';msg.rate=.9;msg.onend=()=>{voiceActive=false;if(!stream)stage.classList.remove('talk')};msg.onerror=msg.onend;speechSynthesis.speak(msg)}else{setTimeout(()=>{voiceActive=false;if(!stream)stage.classList.remove('talk')},2500)}};el('stopTalk').onclick=()=>{hideTalk();status('Stopped')};
async function stopMic(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx){await ctx.close().catch(()=>{});ctx=null}if(!voiceActive)stage.classList.remove('talk');status('Mic OFF')}el('micButton').onclick=async()=>{if(stream){await stopMic();return}if(!navigator.mediaDevices?.getUserMedia){status('Microphone unsupported');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new (window.AudioContext||window.webkitAudioContext)();const source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=256;source.connect(analyser);const data=new Uint8Array(analyser.frequencyBinCount);const tick=()=>{if(!stream)return;analyser.getByteFrequencyData(data);const avg=data.reduce((a,b)=>a+b,0)/data.length;stage.classList.toggle('talk',avg>15||voiceActive);raf=requestAnimationFrame(tick)};tick();status('Mic ON · Voice activity demo (not speech recognition)')}catch(e){status('Mic permission denied or unavailable')}};document.addEventListener('visibilitychange',()=>{if(document.hidden){if(stream)stopMic();hideTalk()}});
</script></body></html>

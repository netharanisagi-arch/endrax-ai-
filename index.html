<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03060d"><meta name="apple-mobile-web-app-capable" content="yes"><title>ENDRAX AI</title><style>
:root{color-scheme:dark;--cyan:#08dfff;--red:#fb2639}*{box-sizing:border-box}body{margin:0;background:#02040a;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}main{max-width:590px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#062034 0%,#02060f 57%,#000 100%);padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;align-items:center}main:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 50% 39%, transparent 0 74px, #09baff10 75px 76px, transparent 77px 110px)}header{width:100%;display:flex;align-items:center;justify-content:space-between;z-index:2;margin-top:18px}.title{text-align:center;font-weight:400;font-size:clamp(28px,8vw,40px);letter-spacing:1px}.title b{color:#08dfff;font-weight:500}.tag{font-size:10px;letter-spacing:4px;color:#b2c1d4;text-align:center;margin-top:5px}.iconBtn{color:#e4f6ff;border:1px solid #15425b;border-radius:50%;background:#04101bd9;width:43px;height:43px;font-size:21px}.faceArea{position:relative;min-height:300px;width:100%;flex:1;max-height:55dvh;display:grid;place-items:center}.halo{position:absolute;inset:12% 4%;border:1px solid #08dfff35;border-radius:50%;box-shadow:0 0 65px #00abff20;animation:breath 4s ease-in-out infinite}.face{width:min(100%,435px);max-height:100%;object-fit:contain;filter:drop-shadow(0 0 16px #07dcff55);animation:float 5s ease-in-out infinite;mix-blend-mode:screen}.status{position:relative;text-align:center;border:1px solid #0b9bd2;border-radius:30px;background:#021723e6;box-shadow:0 0 18px #00b6ff45;padding:10px 28px;font-size:17px;min-width:185px}.status::before{content:'▥';color:var(--cyan);padding-right:16px}.mic{width:112px;height:112px;border:2px solid var(--red);background:radial-gradient(circle,#270008,#04010a 65%);border-radius:100%;box-shadow:0 0 25px #fa103958, inset 0 0 18px #f916373c;color:#ff3f55;font-size:48px;margin:30px 0 8px;animation:breath 2.6s infinite}.mic.active{box-shadow:0 0 55px #fd2849}.caption{color:#9fa9ba;letter-spacing:2px;font-size:11px}.dock{display:flex;justify-content:space-around;width:100%;gap:7px;margin-top:26px}.dock button{flex:1;border:1px solid #153148;background:#030d16df;color:#d5e9fa;border-radius:15px;padding:10px 3px;min-width:0}.dock span{display:block;font-size:24px}.dock small{font-size:11px}.panel{width:100%;z-index:3;border:1px solid #0b8fc5;border-radius:18px;background:#031623f2;box-shadow:0 0 24px #00c7ff35;padding:16px;margin-bottom:8px;max-height:31dvh;overflow:auto}.panel[hidden]{display:none}.panel h3{margin:0 0 10px;color:#45dfff}.panel p{line-height:1.6;margin:6px 0;color:#d5e6ef}.panel button{background:#003a55;border:1px solid #13bada;color:white;border-radius:9px;padding:9px 14px;margin-top:10px}.entry{display:flex;gap:8px;margin-top:10px}.entry input{min-width:0;flex:1;background:#010d18;color:white;border:1px solid #23607c;padding:12px;border-radius:12px}.entry button{margin:0}.hint{font-size:11px;color:#819bac;margin-top:8px;text-align:center;line-height:1.5}.settings{position:absolute;z-index:4;top:90px;right:16px;width:200px;padding:12px;background:#051724;border:1px solid #157aa4;border-radius:14px;box-shadow:0 10px 30px #000}.settings[hidden]{display:none}.settings label{display:block;margin:8px}.sr{position:absolute;left:-10000px}@keyframes float{50%{transform:translateY(-9px)}}@keyframes breath{50%{box-shadow:0 0 35px #03d9ff65}}@media(max-height:740px){.faceArea{min-height:220px;max-height:42dvh}.mic{width:82px;height:82px;margin:12px 0 6px}.dock{margin-top:13px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main><header><button class="iconBtn" aria-label="Menu" id="menu">☰</button><div><div class="title">ENDRAX <b>AI</b></div><div class="tag">ALWAYS HERE FOR YOU</div></div><button class="iconBtn" aria-label="Settings" id="gear">⚙</button></header><div class="settings" id="settings" hidden><label><input type="checkbox" id="say"/> Speak demo replies</label><p style="font-size:12px;color:#b7c4d4">Speech voice depends on iPhone language support.</p></div><section class="faceArea" aria-label="Neon wireframe AI face"><div class="halo"></div><img src="face.webp" class="face" alt="Blue neon geometric AI wireframe face"></section><section id="panel" class="panel" hidden><h3 id="panelTitle"></h3><div id="panelBody"></div><div class="entry"><input id="textInput" placeholder="සිංහලෙන් හෝ English වලින් අහන්න" aria-label="Type a message"><button id="send">➤</button></div></section><div class="status" id="status" role="status">Ready</div><button class="mic" id="mic" aria-label="Start voice command">🎙</button><div class="caption">TAP TO SPEAK</div><nav class="dock"><button data-action="chat"><span>☏</span><small>Chat</small></button><button data-action="ideas"><span>💡</span><small>Ideas</small></button><button data-action="create"><span>✧</span><small>Create</small></button><button data-action="more"><span>▦</span><small>More</small></button></nav><div class="hint">V1 interactive demo · AI සහ live data තවම සම්බන්ධ නැහැ</div></main><script>
const $=id=>document.getElementById(id), panel=$('panel');function show(title,html){$('panelTitle').textContent=title;$('panelBody').innerHTML=html;panel.hidden=false;$('status').textContent='Responding'}function hide(){panel.hidden=true;$('status').textContent='Ready'}function speak(s){if(!$('say').checked||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(s);u.lang='si-LK';speechSynthesis.cancel();speechSynthesis.speak(u)}function safe(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function msg(s){s=s.trim();if(!s)return;let low=s.toLowerCase(); if(/close|hide|අයින්|වසන්න/.test(low)){hide();return}if(/youtube|යූටියුබ්/.test(low)){show('▶ YouTube','<p>YouTube Search විවෘත කරන්න පහළ Button එක ඔබන්න.</p><button id="yt">YouTube Search ↗</button>');$('yt').onclick=()=>window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(s.replace(/youtube/ig,'')),'_blank');speak('යූටියුබ් සෙවුම විවෘත කරන්න පුළුවන්')}else if(/weather|කාලගුණ/.test(low)){show('☁ Weather','<p>මෙය Weather Card එකක Demo එකක් පමණයි. සජීවී කාලගුණ තොරතුරු සම්බන්ධ කර නැහැ.</p><button id="weatherLink">Live weather search ↗</button>');$('weatherLink').onclick=()=>window.open('https://www.google.com/search?q='+encodeURIComponent('weather Sri Lanka'),'_blank');speak('මේක කාලගුණය පෙන්වන ආදර්ශයක්')}else if(/news|පුවත්/.test(low)){show('◈ News','<p>සජීවී පුවත් තවම සම්බන්ධ නැහැ. මෙය News Card ආදර්ශයක්.</p><button id="newsLink">News search ↗</button>');$('newsLink').onclick=()=>window.open('https://news.google.com/','_blank')}else{show('ENDRAX Chat','<p><b>You:</b> '+safe(s)+'</p><p><b>ENDRAX:</b> මේක V1 Interface Demo එකයි. සැබෑ AI Brain එක තවම සම්බන්ධ කර නැහැ.</p>');speak('මේක ඩෙමෝ එකක් පමණයි')} $('textInput').value=''}$('send').onclick=()=>msg($('textInput').value);$('textInput').addEventListener('keydown',e=>{if(e.key==='Enter')msg(e.target.value)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let k=b.dataset.action;if(k==='chat')show('Chat','<p>ENDRAXට Type කරන්න. උදාහරණ: YouTube, Weather, News.</p>');if(k==='ideas')show('Ideas','<p>“අද කාලගුණය”, “YouTube cats”, “News” වගේ Demo Commands උත්සාහ කරන්න.</p>');if(k==='create')show('Create','<p>Image සහ video creation tools ඉදිරි version වලට සම්බන්ධ කරමු.</p>');if(k==='more')show('More','<p>ENDRAX AI V1 · Mobile interface prototype.</p>')});$('gear').onclick=()=>$('settings').hidden=!$('settings').hidden;$('menu').onclick=()=>panel.hidden?show('Commands','<p>YouTube, Weather, News හෝ Chat උත්සාහ කරන්න.</p>'):hide();$('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){show('Voice','<p>මේ Safari browser එකේ speech recognition ලබාගන්න බැහැ. පහළට Type කරලා උත්සාහ කරන්න.</p>');return}let r=new SR();r.lang='si-LK';r.interimResults=false;$('status').textContent='Listening';$('mic').classList.add('active');r.onresult=e=>{let s=e.results[0][0].transcript;msg(s)};r.onerror=e=>{show('Voice','<p>Voice input ලබාගන්න බැරි වුණා. Mic permission සහ Sinhala support පරීක්ෂා කරන්න. Type කිරීම භාවිත කළ හැකියි.</p>')};r.onend=()=>{$('mic').classList.remove('active');if(panel.hidden)$('status').textContent='Ready'};try{r.start()}catch(e){$('mic').classList.remove('active');show('Voice','<p>Microphone start failed. Type කරන්න.</p>')}};
</script></body></html>

<!doctype html>
<html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000812"><title>ENDRAX AI | Animated V5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000812;color:#e5faff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit} .stage{position:relative;margin:auto;width:min(100vw,calc(100dvh * 850 / 1850));height:100dvh;overflow:hidden;background:#00040a} .art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none} .head-glow{position:absolute;left:8%;width:84%;top:18%;height:52%;border-radius:50%;background:radial-gradient(ellipse,#0cf1ff18 0%,transparent 58%);animation:glow 3s ease-in-out infinite;pointer-events:none}.eyes{position:absolute;left:20%;top:43%;width:60%;height:5%;pointer-events:none;animation:blink 7s ease-in-out infinite;filter:drop-shadow(0 0 10px #13f0ff)} .eyes:before,.eyes:after{content:'';position:absolute;width:16%;height:18%;border-radius:50%;background:#00c9ff55;top:40%}.eyes:before{left:14%}.eyes:after{right:14%}
.mouth-matte{position:absolute;left:35.1%;top:59.6%;width:29.7%;height:3.6%;border-radius:45%;background:radial-gradient(ellipse,#00121e 35%,#00121ee6 52%,transparent 76%);pointer-events:none}.mouth{position:absolute;left:37%;top:60.1%;width:26%;height:2%;pointer-events:none;filter:drop-shadow(0 0 8px #0ce3ff);transform-origin:center}.lip{position:absolute;left:6%;top:2%;width:88%;height:96%;border:2px solid #46ecff;border-radius:48% 48% 52% 52%;background:radial-gradient(ellipse,#00324a 5%,#000915 80%);box-shadow:0 0 9px #00cfff55,inset 0 0 6px #13a7fe;transform:scaleY(.27)} .mouth.talking .lip{animation:talk .19s ease-in-out infinite alternate}.mouth.listening .lip{animation:listen .47s ease-in-out infinite alternate}
.mic{position:absolute;left:43%;bottom:2.4%;width:14%;height:6.5%;cursor:pointer;background:transparent;border:0;z-index:5;border-radius:50%} .menu{position:absolute;left:0;top:0;width:13%;height:7%;border:0;background:transparent;z-index:5;cursor:pointer} .badge{position:absolute;left:8%;right:8%;bottom:10%;background:#001827ec;border:1px solid #00aeeb;color:#b9efff;border-radius:13px;text-align:center;padding:8px;font-size:12px;z-index:6} .badge[hidden],.panel[hidden],.result[hidden]{display:none}.panel,.result{position:absolute;z-index:8;left:5%;right:5%;top:11%;padding:16px;border:1px solid #12c6fa;border-radius:16px;background:#001021f2;box-shadow:0 0 30px #0074e955;max-height:75%;overflow:auto}.panel h2,.result h2{font-size:18px;margin:0 0 13px}.panel button,.result button{border-radius:11px;border:1px solid #12aafa;background:#052e46;color:#eaffff;padding:10px;margin:4px;cursor:pointer}.panel input{background:#011422;border:1px solid #168ace;padding:10px;border-radius:9px;color:white;width:100%}.close{float:right}.mini{font-size:12px;color:#8fc5db}.result a{color:#77ebff;overflow-wrap:anywhere}.line{border-top:1px solid #196786;margin:12px 0}.filepreview img,.filepreview video{width:100%;max-height:190px;object-fit:contain}.filepreview{font-size:12px;overflow-wrap:anywhere}.result{top:29%;left:43%;right:2%;font-size:12px}.result h2{font-size:14px}.result .thumb{width:100%;aspect-ratio:16/9;background:linear-gradient(130deg,#003752,#072137,#020713);display:grid;place-items:center;font-size:40px;border-radius:8px;margin:5px 0}.status-dot{display:inline-block;background:#fb3155;border-radius:50%;width:7px;height:7px;margin-right:6px}
@keyframes talk{0%{transform:scaleY(.24)}35%{transform:scaleY(1.3)}65%{transform:scaleY(.62)}100%{transform:scaleY(1.9)}}@keyframes listen{from{transform:scaleY(.18)}to{transform:scaleY(.65)}}@keyframes glow{50%{opacity:.35;transform:scale(1.02)}}@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
@media(prefers-reduced-motion:reduce){.head-glow,.eyes{animation:none}}
</style></head><body><main class="stage">
<img class="art" src="face.png" alt="ENDRAX AI neon-blue wireframe face" draggable="false"><div class="head-glow"></div><div class="eyes"></div><div class="mouth-matte"></div><div class="mouth" id="mouth"><div class="lip"></div></div>
<button class="menu" id="menu" aria-label="Open menu"></button><button class="mic" id="mic" aria-label="Microphone on/off"></button><div class="badge" id="badge" hidden></div>
<section class="panel" id="panel" hidden><button class="close" id="close">✕</button><h2>ENDRAX AI · Controls</h2><button id="speak">▶ Talking demo</button><button id="stopSpeak">◼ Stop</button><button id="youtube">▶ YouTube demo</button><div class="line"></div><p class="mini">Text / Link / Photo / Video / PDF — locally preview only</p><input id="text" placeholder="Type a message or paste a link..."><button id="display">Show</button><input id="file" type="file" accept="image/*,video/*,application/pdf"><div id="filepreview" class="filepreview"></div><p class="mini">This version is animation + interface demo. No AI brain or automatic real YouTube search.</p></section>
<section class="result" id="result" hidden><button class="close" id="resultClose">✕</button><h2 id="resultTitle">Results</h2><div id="resultBody"></div></section>
</main><script>
const $=id=>document.getElementById(id);let stream=null,analyser=null,audioCtx=null,raf=0,monitorTimer=0,talkTimer=0,speaking=false;
function note(s){$('badge').textContent=s;$('badge').hidden=false;clearTimeout(monitorTimer);monitorTimer=setTimeout(()=>$('badge').hidden=true,2800)}
function mode(s){$('mouth').className='mouth'+(s?' '+s:'')}
$('menu').onclick=()=>$('panel').hidden=!$('panel').hidden;$('close').onclick=()=>$('panel').hidden=true;
function card(title,body){$('resultTitle').textContent=title;$('resultBody').replaceChildren(body);$('result').hidden=false;$('panel').hidden=true} $('resultClose').onclick=()=>$('result').hidden=true;
function youtubeCard(q){const box=document.createElement('div');const a=document.createElement('a');a.href='https://www.youtube.com/results?search_query='+encodeURIComponent(q);a.target='_blank';a.rel='noopener noreferrer';const t=document.createElement('div');t.className='thumb';t.textContent='▶';const label=document.createElement('div');label.textContent='Search YouTube for: '+q;a.append(t,label);box.append(a);const small=document.createElement('p');small.className='mini';small.textContent='Search link demo — not live video results.';box.append(small);card('YouTube',box)}
$('youtube').onclick=()=>youtubeCard('AI technology');$('display').onclick=()=>{const v=$('text').value.trim();if(!v)return; if(/youtube|යූටියුබ්/i.test(v)){youtubeCard(v.replace(/youtube/ig,'').trim()||'AI technology');return} const box=document.createElement('div');if(/^https?:\/\//i.test(v)){const a=document.createElement('a');a.href=v;a.textContent=v;a.target='_blank';a.rel='noopener noreferrer';box.append(a)}else box.textContent=v;card('Preview',box)};
$('file').onchange=()=>{const f=$('file').files?.[0];const box=$('filepreview');box.replaceChildren();if(!f)return;const p=document.createElement('p');p.textContent='Selected: '+f.name;box.append(p);if(f.type.startsWith('image/')||f.type.startsWith('video/')){const url=URL.createObjectURL(f);const e=document.createElement(f.type.startsWith('image/')?'img':'video');e.src=url;if(e.tagName==='VIDEO')e.controls=true;e.onload=()=>{if(e.tagName==='IMG')URL.revokeObjectURL(url)};box.append(e)}note('File selected — preview only')};
function endVoice(){if(window.speechSynthesis)window.speechSynthesis.cancel();speaking=false;clearInterval(talkTimer);if(!stream)mode('')}
$('speak').onclick=()=>{endVoice();speaking=true;mode('talking');$('panel').hidden=true;note('Talking demo (not AI)');const phrase='ආයුබෝවන්. මම ENDRAX AI. මෙය මගේ කතා කරන මුහුණේ පරීක්ෂණයක්.';if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(phrase);u.lang='si-LK';u.rate=.88;u.onend=()=>{speaking=false;if(!stream)mode('')};u.onerror=()=>{speaking=false;if(!stream)mode('');note('Sinhala voice may not be supported on this device')};speechSynthesis.speak(u)}else{setTimeout(()=>{speaking=false;mode('')},3500);note('Speech synthesis unavailable')}};
$('stopSpeak').onclick=()=>{endVoice();note('Demo stopped')};
async function stopMic(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(audioCtx){await audioCtx.close().catch(()=>{});audioCtx=null}if(!speaking)mode('');note('Microphone OFF')}
$('mic').onclick=async()=>{if(stream){stopMic();return}if(!navigator.mediaDevices?.getUserMedia){note('Microphone not available in this browser');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new (window.AudioContext||window.webkitAudioContext)();const src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=512;src.connect(analyser);const values=new Uint8Array(analyser.frequencyBinCount);function sample(){if(!stream)return;analyser.getByteTimeDomainData(values);let sum=0;for(const x of values){const y=(x-128)/128;sum+=y*y}const rms=Math.sqrt(sum/values.length);if(!speaking)mode(rms>.025?'listening':'');raf=requestAnimationFrame(sample)}sample();note('Microphone ON · amplitude demo only (no speech recognition)')}catch(e){note('Microphone permission unavailable')}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(stream)stopMic();endVoice()}});
</script></body></html>

<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040a"><title>ENDRAX AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#edfaff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:590px;min-height:100svh;margin:auto;display:flex;flex-direction:column;align-items:center;position:relative;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 22px);background:radial-gradient(ellipse at 50% 45%,#052033 0%,#020712 62%,#000 100%);overflow:hidden}main:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 50% 42%,transparent 0 77px,#00bfff10 78px 79px,transparent 80px 125px)}.heading{z-index:1;text-align:center;font-size:clamp(29px,8vw,42px);letter-spacing:1.5px}.heading b{color:#12dbff;font-weight:500}.sub{font-size:10px;color:#b0c0cb;letter-spacing:3px;margin-top:6px;text-align:center;z-index:1}.portrait{flex:1;display:grid;place-items:center;width:100%;max-height:66svh;min-height:250px;position:relative}.portrait img{width:100%;height:100%;max-height:62svh;object-fit:contain;filter:drop-shadow(0 0 18px #00c8ff66);animation:float 5s ease-in-out infinite}.pill{z-index:1;min-width:188px;border:1px solid #06bfee;border-radius:999px;background:#041725e8;color:#dffaff;padding:10px 24px;text-align:center;box-shadow:0 0 20px #05bdf740;font-size:16px}.pill.on{border-color:#ff2e4b;box-shadow:0 0 20px #fd164a80}.mic{z-index:1;margin:26px 0 10px;width:116px;height:116px;border-radius:50%;border:3px solid #f7284b;background:radial-gradient(circle,#2f0011 0%,#100009 55%,#070308 100%);color:#ff4760;box-shadow:0 0 32px #ee174a70;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.mic svg{width:47px;height:47px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.mic.on{color:#fff;background:radial-gradient(circle,#d21742,#3a0611 60%,#070308);box-shadow:0 0 60px #f21b4ea6;animation:pulse 1.4s infinite}.caption{z-index:1;color:#a9bed0;font-size:13px;letter-spacing:3px;margin-bottom:18px}.result{z-index:2;width:100%;max-height:24svh;overflow:auto;padding:14px 18px;border:1px solid #18badf;border-radius:18px;background:#031420ec;box-shadow:0 0 22px #08bff940;margin:0 0 12px}.result[hidden]{display:none}.result h3{margin:0 0 8px;color:#28deff}.result p{margin:4px 0;line-height:1.5}.result a{color:#52d7ff}.note{z-index:1;color:#8196a5;font-size:10px;text-align:center}.portrait.quiet img{animation-play-state:paused}@keyframes float{50%{transform:translateY(-8px)}}@keyframes pulse{50%{box-shadow:0 0 72px #ff164ce3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-height:680px){.portrait{max-height:50svh;min-height:180px}.mic{width:85px;height:85px;margin:12px 0}.mic svg{width:38px;height:38px}}
</style></head><body><main><div class="heading">ENDRAX <b>AI</b></div><div class="sub">ALWAYS HERE FOR YOU</div><div class="portrait" aria-label="Neon wireframe AI face"><img src="face.webp" alt="Blue geometric wireframe face"></div><section id="result" class="result" hidden aria-live="polite"><h3 id="cardTitle"></h3><div id="cardBody"></div></section><div class="pill" id="status" role="status">Microphone OFF</div><button type="button" class="mic" id="mic" aria-pressed="false" aria-label="Turn microphone on"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button><div class="caption" id="micCaption">TAP TO TURN ON</div><div class="note">V1 voice demo · සැබෑ AI සහ live data තවම සම්බන්ධ නැහැ</div></main><script>
(()=>{const mic=document.getElementById('mic'),status=document.getElementById('status'),caption=document.getElementById('micCaption'),card=document.getElementById('result');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let isOn=false,rec=null,manualStop=false;function state(on){isOn=on;mic.classList.toggle('on',on);mic.setAttribute('aria-pressed',String(on));mic.setAttribute('aria-label',on?'Turn microphone off':'Turn microphone on');status.classList.toggle('on',on);status.textContent=on?'Listening…':'Microphone OFF';caption.textContent=on?'TAP TO TURN OFF':'TAP TO TURN ON'}function show(title,html){document.getElementById('cardTitle').textContent=title;document.getElementById('cardBody').innerHTML=html;card.hidden=false}function interpret(s){const q=s.toLowerCase();if(/hide|close|අයින්|වහන්න|වසන්න/.test(q)){card.hidden=true;return}if(/youtube|යූටියුබ්/.test(q)){show('YouTube','<p>ඔයා ඉල්ලූ YouTube සෙවුම විවෘත කරන්න:</p><p><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/">Open YouTube ↗</a></p>')}else if(/weather|කාලගුණ/.test(q)){show('Weather','<p>මේක Weather Card Demo එකක්. Live weather තවම සම්බන්ධ නැහැ.</p>')}else if(/news|පුවත්/.test(q)){show('News','<p>මේක News Card Demo එකක්. Live news තවම සම්බන්ධ නැහැ.</p>')}else{show('ENDRAX AI','<p>ඇසුණේ: '+escapeHtml(s)+'</p><p>AI Brain එක තවම සම්බන්ධ කරලා නැහැ.</p>')}}function escapeHtml(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function off(){manualStop=true;state(false);if(rec){try{rec.stop()}catch(e){}rec=null}}function on(){if(!SR){state(false);show('Voice unavailable','<p>මේ Safari version එකේ Voice Recognition support නැති විය හැකියි. පසුව Voice backend එකක් සම්බන්ධ කරමු.</p>');return}manualStop=false;card.hidden=true;rec=new SR();rec.lang='si-LK';rec.interimResults=false;rec.continuous=false;rec.onresult=e=>{interpret(e.results[0][0].transcript)};rec.onerror=e=>{if(!manualStop){off();show('Microphone','<p>Voice recognition ක්‍රියා නොකළා. Microphone permission සහ browser support පරීක්ෂා කරන්න.</p>')}};rec.onend=()=>{if(isOn&&!manualStop){try{rec.start()}catch(e){off()}}};try{rec.start();state(true)}catch(e){off();show('Microphone','<p>Microphone ආරම්භ කරන්න බැරි වුණා.</p>')}}mic.addEventListener('click',()=>isOn?off():on());window.addEventListener('pagehide',off)})();
</script></body></html>
